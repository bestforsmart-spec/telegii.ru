<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 28 340 352" width="340" height="352">
  <defs>
    <radialGradient id="cap" cx="36%" cy="26%" r="80%">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset=".42" stop-color="#ef3b24"/>
      <stop offset=".78" stop-color="#cc2214"/>
      <stop offset="1" stop-color="#9c130a"/>
    </radialGradient>
    <linearGradient id="capShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".62" stop-color="#5a0600" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a0600" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="spot" cx="38%" cy="32%" r="72%">
